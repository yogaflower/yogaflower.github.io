<!DOCTYPE html><html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Yoga Flower｜予約状況カレンダー</title><link rel="icon" href="images/yogaflower.ico" type="image/x-icon"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@500;700&family=Zen+Maru+Gothic:wght@400;500;700&display=swap" rel="stylesheet"><style>:root{--ink:#1f150c;--sub:#6f6257;--paper:rgba(255,253,248,.88);--line:rgba(31,21,12,.14);--green:#7d9b84;--shadow:0 14px 34px rgba(31,21,12,.10)}*{box-sizing:border-box}body{margin:0;font-family:'Zen Maru Gothic',sans-serif;color:var(--ink);background:url('images/bg.png') center top/cover fixed;padding:24px 12px}body:before{content:'';position:fixed;inset:0;background:rgba(255,253,248,.36);z-index:-1}.wrap{width:min(980px,100%);margin:0 auto;background:var(--paper);border:1px solid var(--line);border-radius:28px;box-shadow:var(--shadow);padding:22px}.logo{width:180px;margin:0 auto 12px}h1{font-family:'Noto Serif JP',serif;text-align:center;margin:0 0 8px;font-size:28px}.lead{text-align:center;color:var(--sub);margin:0 0 18px;font-size:14px}.calendar{display:grid;grid-template-columns:repeat(7,1fr);border:1px solid var(--line);border-radius:18px;overflow:hidden;background:#fffdf8}.cell,.dow{min-height:92px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:8px}.dow{min-height:auto;text-align:center;font-weight:700;color:var(--sub);background:rgba(255,253,248,.74)}.cell:nth-child(7n),.dow:nth-child(7n){border-right:0}.date{font-weight:700;font-size:14px}.sun .date{color:#b76f78}.sat .date{color:#5f7f99}.status{display:inline-flex;margin-top:8px;border-radius:999px;padding:4px 10px;font-weight:700;font-size:13px}.empty{background:rgba(125,155,132,.15);color:#516f58}.few{background:rgba(184,139,107,.16);color:#9a6b4d}.full{background:rgba(183,92,92,.13);color:#a24d4d}.off{background:rgba(111,98,87,.12);color:#6f6257}.note{font-size:12px;color:var(--sub);margin-top:5px;line-height:1.45}.month-nav{display:flex;align-items:center;justify-content:center;gap:12px;margin:14px 0 18px}.month-nav button{border:1px solid var(--line);background:#fffdf8;border-radius:999px;padding:8px 14px;font-family:inherit;font-weight:700;color:var(--ink)}.month-title{font-family:'Noto Serif JP',serif;font-size:24px;font-weight:700;min-width:160px;text-align:center}@media(max-width:700px){.wrap{padding:14px;border-radius:22px}.cell{min-height:78px;padding:6px}.date{font-size:12px}.status{font-size:11px;padding:3px 7px}.note{font-size:11px}.logo{width:150px}}</style></head><body><div class="wrap"><img class="logo" src="images/logo.png" alt="Yoga Flower"><h1>予約状況カレンダー</h1><p class="lead">空き状況をご確認のうえ、LINEよりお問い合わせください。</p><div class="month-nav"><button onclick="changeMonth(-1)">前の月</button><div class="month-title" id="monthTitle"></div><button onclick="changeMonth(1)">次の月</button></div><div class="calendar" id="calendar"></div></div><script>const API_URL='https://script.google.com/macros/s/AKfycbzlyU2DNJtiQNL5gQ9Lex55qsXyxQ4mI9bghM3bhjcQX5adCDmAcahI_v5RzBuYDi4T/exec';let current=new Date();current.setDate(1);let calendarRows=[];function esc(t){return String(t??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#039;')}function loadData(){const cb='calendarCallback_'+Date.now();const s=document.createElement('script');window[cb]=res=>{calendarRows=res&&res.data&&res.data.calendar?res.data.calendar:[];renderCalendar();s.remove();delete window[cb]};s.src=API_URL+'?action=getData&callback='+cb+'&t='+Date.now();s.onerror=()=>renderCalendar();document.body.appendChild(s)}function changeMonth(diff){current.setMonth(current.getMonth()+diff);renderCalendar()}function statusClass(status){if(status==='満席')return 'full';if(status==='残りわずか')return 'few';if(status==='休み')return 'off';return 'empty'}function renderCalendar(){const y=current.getFullYear(),m=current.getMonth();monthTitle.textContent=`${y}年${m+1}月`;const first=new Date(y,m,1),last=new Date(y,m+1,0),start=first.getDay();const map={};calendarRows.forEach(r=>{if(r.date)map[r.date]=r});let html=['日','月','火','水','木','金','土'].map(d=>`<div class="dow">${d}</div>`).join('');for(let i=0;i<start;i++)html+='<div class="cell"></div>';for(let d=1;d<=last.getDate();d++){const ds=`${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;const row=map[ds];const day=new Date(y,m,d).getDay();const cls=day===0?' sun':day===6?' sat':'';html+=`<div class="cell${cls}"><div class="date">${d}</div>${row&&row.status?`<div class="status ${statusClass(row.status)}">${esc(row.status)}</div>`:''}${row&&row.note?`<div class="note">${esc(row.note)}</div>`:''}</div>`}calendar.innerHTML=html}loadData();</script></body></html>
